name: J4 P2 batch 3 bounded verification
on:
  push:
    branches: ['j4/p2c-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Project tests and package
        run: ./mvnw -B package -Dspring-javaformat.skip=true
      - name: Boot and characterize
        run: python3 j4_stage.py
      - name: Independent seeded faults
        run: python3 j4_seeds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            surface.actual.json
            project-tests.*
            target/surefire-reports/*.xml
            boot.log
            seed-results.json
            seed-evidence/
            http-evidence/
            yarn.lock
          retention-days: 30
